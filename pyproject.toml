[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfilter"
version = "0.1.0"
description = "A Python implementation of Kalman filtering"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Michael Lanahan", email = "michael.lanahan0430@gmail.com" },
]
dependencies = [
    "numpy>=1.20.0",
    "polars>=1.41",
    "scipy>=1.17.0",
    "jax>=0.10.0",
    "equinox>=0.13.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "mypy",
    "ruff",
    "scipy-stubs>=1.17.0",
    "ipykernel>=7.2.0",
    "matplotlib",
    "rich",
    "numba",
    "jaxtyping",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kalman_python = ["py.typed"] # If you want to include type hints

[tool.mypy]
files = ["src"]            # your package name
python_version = "3.13"
warn_return_any = false    # Too strict for complex covariance union types
warn_unused_configs = true
# Allow some flexibility for array indexing and complex union operations
disable_error_code = [
    "misc",
    "call-overload",
    "index",
    "assignment",
] # Disable errors for complex numpy/covariance union types that are correct at runtime

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
    "B",  # flake8-bugbear (catches real bugs)
]
ignore = [
    "N806",   #I don't like making math variables lower case.
    "N803",   #I don't like making math variables lower case.
    "N801",   #I don't like making math variables lower case.
    "N802",   #I don't like making math variables lower case.
    "FBT001", #dumb rule 
    "FBT002", #dumb rule 
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ALL"]
"src/sandbox/**/*.py" = ["ALL"]
"examples/**/" = ["ALL"]
